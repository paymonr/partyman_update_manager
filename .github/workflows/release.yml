name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PartyMAN Update Manager v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Upload sig and generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE_DIR="src-tauri/target/release/bundle/macos"
          SIG_FILE="${BUNDLE_DIR}/PartyMAN-Update-Manager.app.tar.gz.sig"

          # Upload the .sig file to the release
          gh release upload "v${VERSION}" "${SIG_FILE}" --clobber

          # Find the URL of the .app.tar.gz asset that tauri-action uploaded
          TAR_URL=$(gh release view "v${VERSION}" --json assets \
            --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browserDownloadUrl')

          SIG=$(cat "${SIG_FILE}")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{
  "version": "%s",
  "notes": "",
  "pub_date": "%s",
  "platforms": {
    "darwin-aarch64": {
      "signature": "%s",
      "url": "%s"
    }
  }
}\n' "${VERSION}" "${PUB_DATE}" "${SIG}" "${TAR_URL}" > latest.json

          gh release upload "v${VERSION}" latest.json --clobber

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PartyMAN Update Manager v__VERSION__
          releaseDraft: true
          prerelease: false

      - name: Sign artifact and generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          LOCAL_TAR="src-tauri/target/release/bundle/macos/PartyMAN-Update-Manager.app.tar.gz"

          # Sign the local artifact (same bytes tauri-action uploaded)
          npx tauri signer sign "${LOCAL_TAR}"
          SIG=$(cat "${LOCAL_TAR}.sig")

          # Get the asset filename from the release (e.g. PartyMAN-Update-Manager_aarch64.app.tar.gz)
          TAR_FILENAME=$(gh release view "v${VERSION}" --json assets \
            --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .name')
          TAR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${TAR_FILENAME}"

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "${VERSION}" \
            --arg pub_date "${PUB_DATE}" \
            --arg sig "${SIG}" \
            --arg url "${TAR_URL}" \
            '{version:$version,notes:"",pub_date:$pub_date,platforms:{"darwin-aarch64":{signature:$sig,url:$url}}}' \
            > latest.json

          gh release upload "v${VERSION}" "${LOCAL_TAR}.sig" --clobber
          gh release upload "v${VERSION}" latest.json --clobber
